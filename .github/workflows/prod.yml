name: "PRODUCTION DEPLOY"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  drizzle:
    uses: Malldre/Github-Actions/.github/workflows/drizzle.yml@main

  terraform:
    needs: drizzle
    uses: Malldre/Github-Actions/.github/workflows/terraform.yml@main
    with:
      environment: dev
      aws-assume-role-arn: 'arn:aws:iam::652099910794:role/github-actions'
      aws-region: 'us-east-1'
      aws-statefile-s3-bucket: "wms-terraform-statefile"
      aws-lock-dynamodb-table: "wms-terraform-lock"